name: Update Zod Lockfile

on:
  push:
    branches:
      - security/centralized-zod-validation-20260917

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/centralized-zod-validation-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: update lockfile for Zod"
          git push origin HEAD:security/centralized-zod-validation-20260917
