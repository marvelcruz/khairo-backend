name: Install Zod Temp

on:
  push:
    branches: [refactor/central-validation-20260917]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/central-validation-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Add Zod dependency once
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.dependencies?.zod ? 0 : 1)"; then
            echo "Zod already present; nothing to do."
            exit 0
          fi
          npm install zod@3.24.2 --save
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add zod validation dependency"
          git push
