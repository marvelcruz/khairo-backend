name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Verify critical module imports
        run: |
          node --input-type=module <<'NODE'
          await Promise.all([
            import('./controllers/qualificationController.js'),
            import('./services/qualificationCommunicationService.js'),
            import('./jobs/scheduler.js'),
          ]);
          console.log('Critical backend imports resolved.');
          NODE
